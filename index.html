<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohalla Mart (Early Demo)</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#f7f1e5"><link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e5;--surf:#fffdf8;--ink:#0f1f1a;--mut:#5d6b64;--line:#e6dcc8;--brand:#116b5b;--sun:#f5aa1c;--rose:#d6336c;--ok:#1f8a4c;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "DM Sans",system-ui,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);color:var(--brand);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font:800 22px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.4px}
.cartb{position:relative;border:1px solid var(--line);background:var(--surf);color:var(--brand);border-radius:999px;padding:7px 14px;font-weight:700}
.cartb b{background:var(--sun);color:#0f1f1a;border-radius:999px;padding:1px 7px;margin-left:6px;font-size:13px}
.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--surf);color:var(--ink)}
.tick{background:#0f1f1a;color:#f7f1e5;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:.4px}
.trk{display:inline-block;padding:9px 0;animation:mv 24s linear infinite}
.trk span{margin:0 26px}
@keyframes mv{to{transform:translateX(-50%)}}
.art{overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.em{font-size:60px}
.off{z-index:2}
.hrt{position:absolute;right:8px;top:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#444;font-size:19px;display:grid;place-items:center}
.hrt[aria-pressed=true]{color:var(--rose)}
.wa{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:26;width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;font-size:28px;display:none;place-items:center;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.lnk{display:block;margin:10px 0;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--brand);font-weight:700;text-decoration:none}
.banner.photo{background:linear-gradient(90deg,rgba(15,31,26,.72),rgba(15,31,26,.15)),var(--bi) center/cover;color:#fff;border:0;min-height:230px}
.banner.photo h1{color:#fff}.banner.photo span,.banner.photo em{display:none}
.hero{margin:12px 14px 0;border-radius:16px;padding:20px 18px;background:var(--brand);color:#fff;position:relative;overflow:hidden}
.hero small{letter-spacing:1.2px;opacity:.85;font-weight:500}
.hero h1{font:800 27px/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:8px 0 8px}
.hero p{margin:0 0 16px;opacity:.92}
.hero button{width:100%;text-align:left;border:0;background:#fff;color:var(--brand);border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px}
.hero.photo{background:linear-gradient(rgba(15,31,26,.65),rgba(15,31,26,.65)),var(--bi) center/cover}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 14px}
@media(min-width:640px){.tg{grid-template-columns:repeat(4,1fr)}}
.tile{border:0;background:none;padding:0;text-align:center;font-weight:700;color:var(--ink)}
.tile .tp{position:relative;aspect-ratio:1/1;border-radius:14px;display:grid;place-items:center;font-size:64px;overflow:hidden;border:1px solid var(--line)}
.tile .tp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .l{display:block;margin-top:8px}
.tile small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:500;color:var(--ink)}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hr{display:flex;gap:8px;align-items:center}
.acct{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--brand);font-weight:800;font-size:17px}
.cta{width:100%;border:0;background:var(--brand);color:#fff;border-radius:12px;padding:13px;font-weight:700;font-size:16px;margin-top:10px}
.cta:disabled{opacity:.6}
.fld{display:block;margin:10px 0}.fld span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.fld select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:var(--surf);color:var(--ink)}
.pv{display:none;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-top:8px}
.mp{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mp img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surf);flex:none}
.mp small{color:var(--mut)}.st{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:#fbeccb;color:#7a4b00}.st.live{background:#e8f3ef;color:var(--brand)}
.ap{border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;background:var(--brand);color:#fff;display:block;width:100%}
.ap.no{background:var(--surf);color:var(--rose);border:1px solid var(--line);margin-top:6px}.ap:disabled{opacity:.5}
.ah{font-size:16px;margin:16px 0 2px}.sb a{color:var(--brand);font-weight:600}
.ft{padding:18px 14px 96px;text-align:center;font-size:13px;color:var(--mut)}.ft .lnkb{font-weight:600;font-size:13px}
.lg h4{margin:16px 0 4px;font-size:15px}.lg p{font-size:14px;color:var(--mut);margin:0 0 6px;line-height:1.55}
.bn{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 14px 0;scrollbar-width:none}.bn::-webkit-scrollbar,.dl::-webkit-scrollbar,.fl::-webkit-scrollbar{display:none}
.bs{flex:0 0 100%;scroll-snap-align:start;border:0;border-radius:16px;padding:20px 18px;color:#fff;min-height:150px;text-align:left;font:inherit;display:flex;flex-direction:column;justify-content:center;gap:4px;cursor:pointer}
.bs small{letter-spacing:.12em;font-weight:700;opacity:.9}.bs h2{margin:0;font-size:28px;line-height:1.1}.bs span{font-size:14px;opacity:.95}.bs b{margin-top:8px;align-self:flex-start;background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--brand);width:18px;border-radius:6px}
.dh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 14px 4px}.dh h2{margin:0;font-size:19px}.dh span{font-size:12px;color:var(--mut)}
.dl{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}.dc{flex:0 0 140px;background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.dc .art{aspect-ratio:1/1;font-size:44px}.dc .dp{padding:8px 8px 0;flex:1}.dc .nm{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.dc .add{margin:8px}
.fl{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none;align-items:center}.fl select{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;background:var(--surf);color:var(--ink)}
.sv{color:var(--ok);font-size:12px;font-weight:700;margin-top:2px}.fdl{font-size:11px;color:var(--mut)}
.fld input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:var(--surf);color:var(--ink)}
.seg{display:flex;gap:8px;margin:12px 0 4px}
.err{color:var(--rose);font-size:14px;min-height:20px;margin-top:6px}
.lnkb{background:none;border:0;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;font-size:inherit}
.rb{display:inline-block;background:#e8f3ef;color:var(--brand);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.demo{background:#fbeccb;color:#7a4b00;padding:8px 14px;font-size:13px}
.cats{display:flex;gap:16px;overflow-x:auto;padding:16px 14px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px;font-weight:500;font-size:13px}
.cat i{font-style:normal;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--surf);border:2px solid var(--line)}
.cat[aria-pressed=true] i{border-color:var(--sun);box-shadow:0 0 0 3px rgba(244,168,29,.25)}
.cat[aria-pressed=true]{font-weight:700}
.banner{margin:10px 14px;border-radius:16px;padding:22px 18px;color:var(--brand);background:#f1e8d4;border:1px solid var(--line);position:relative;overflow:hidden}
.banner h1{font:800 26px/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;max-width:12ch}
.banner p{margin:0 0 12px;max-width:28ch}
.banner button{border:0;background:var(--sun);color:#0f1f1a;border-radius:999px;padding:9px 18px;font-weight:700}
.banner em{position:absolute;right:6px;top:10px;font-size:38px;font-style:normal}
.banner span{position:absolute;right:14px;bottom:6px;font-size:78px;opacity:.9}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:14px 14px 8px}
.sec h2{margin:0;font:800 19px "Bricolage Grotesque",system-ui,sans-serif}
.sec small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr)}body{max-width:1100px;margin:0 auto}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.art{position:relative;aspect-ratio:1/1.05;display:grid;place-items:center;font-size:60px}
.off{position:absolute;left:8px;top:8px;background:var(--rose);color:#fff;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700}
.info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nm{font-weight:500;line-height:1.3}
.by{font-size:12px;color:var(--mut)}
.pr{font-weight:700;font-size:17px;margin-top:2px}
.pr s{color:var(--mut);font-weight:400;font-size:13px;margin-left:6px}
.add{margin-top:8px;border:1.5px solid var(--brand);background:none;color:var(--brand);border-radius:10px;padding:8px;font-weight:700}
.msg{grid-column:1/-1;text-align:center;color:var(--mut);padding:36px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);min-width:64px}
nav button span{font-size:21px}
nav button.on{color:var(--brand);font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80%;background:var(--bg);z-index:31;border-radius:18px 18px 0 0;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.scrim.on,.sheet.on{display:flex}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh h2{margin:0;font:800 20px "Bricolage Grotesque",system-ui,sans-serif}
.x{border:0;background:var(--surf);width:34px;height:34px;border-radius:50%}
.sb{overflow-y:auto;padding:6px 16px;flex:1}
.ln{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ln div{flex:1}.ln small{color:var(--mut)}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surf)}
.sf{padding:12px 16px;border-top:1px solid var(--line);background:var(--surf)}
.sf p{margin:6px 0;color:var(--mut);font-size:13px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;font-size:14px}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.trk{animation:none}*{transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<header>
<div class="top"><div class="logo">Mohalla Mart</div><div class="hr"><button class="acct" id="ab" aria-label="Account">👤</button><button class="cartb" id="cb" aria-label="Open cart">Cart<b id="cn">0</b></button></div></div>
<label class="search"><input id="q" type="search" placeholder="Search kurtas, jhumkas, gifts…" aria-label="Search products"></label>
</header>
<div class="tick" aria-label="Free delivery over 999 rupees. Sold by local makers."><div class="trk"><span>🚚 Free delivery over ₹999</span><span>🧵 Sold by local makers</span><span>🛍️ New styles every week</span><span>🚚 Free delivery over ₹999</span><span>🧵 Sold by local makers</span><span>🛍️ New styles every week</span></div></div>
<div class="demo">Early demo: products and sellers shown are samples. Real makers are joining soon.</div>
<section id="bn"></section>
<section id="tiles" aria-label="Shop by category" style="margin-top:6px"></section>
<section id="dl"></section>
<div class="sec"><h2 id="ttl">Trending now</h2><small id="cnt"></small></div>
<div class="pills" id="cats" role="group" aria-label="Filter by category"></div>
<div class="fl" id="flt"></div>
<main class="grid" id="g"><div class="msg">Loading…</div></main>

<footer class="ft"><button class="lnkb" data-lg="terms">Terms of Use</button> · <button class="lnkb" data-lg="returns">Returns &amp; Refunds</button> · <button class="lnkb" data-lg="privacy">Privacy</button><br><span>© Mohalla Mart, Lucknow</span></footer>
<nav>
<button class="on" id="n1"><span>🏠</span>Home</button>
<button id="n2"><span>▦</span>Categories</button>
<button id="n3"><span>🛒</span>Cart</button>
<button id="n4"><span>💬</span>Contact</button>
</nav>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-live="polite"></aside>
<a class="wa" id="wa" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">💬</a>
<div class="toast" id="toast" role="status"></div>

<script src="/config.js"></script>
<script>
const ICON={kurta:"👗",stole:"🧣",bag:"👜",jhumka:"💍",vase:"🏺",diya:"🪔",cushion:"🛋️",macrame:"🌿",hamper:"🎁",mug:"☕",candle:"🕯️",oil:"🧴",comb:"🪮",lip:"💄"};
const CATI={All:"✨",Fashion:"👗",Accessories:"💍",Home:"🏺",Gifting:"🎁",Beauty:"💄"};
const BG={Accessories:"#e4e0f4",Fashion:"#f7d9c4",Home:"#d8e9e4",Gifting:"#f6d0da",Beauty:"#fbe3b8"};
let P=[],cat="All",q="",cart={},wish=new Set();
try{wish=new Set(JSON.parse(localStorage.getItem("mm_wish")||"[]"))}catch(e){}
const saveW=()=>{try{localStorage.setItem("mm_wish",JSON.stringify([...wish]))}catch(e){}};
const waLink=()=>{const n=(typeof WA_NUMBER==="string"?WA_NUMBER:"").replace(/\D/g,"");return n.length>=10?"https://wa.me/"+n+"?text="+encodeURIComponent("Hi Mohalla Mart"):""};
const thumb=p=>`<span class="em">${icon(p)}</span>${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">`:""}<button class="hrt" data-w="${p.id}" aria-label="Save ${esc(p.name)}" aria-pressed="${wish.has(String(p.id))}">${wish.has(String(p.id))?"♥":"♡"}</button>`;
function contactView(){const w=waLink();sheet(`<div class="sh"><h2>Contact us</h2><button class="x" data-close aria-label="Close">✕</button></div><div class="sb"><p>Questions, or want to sell with us? Message us:</p>${w?`<a class="lnk" href="${w}" target="_blank" rel="noopener">💬 WhatsApp</a>`:""}<a class="lnk" href="https://instagram.com/mohalla.mart" target="_blank" rel="noopener">📷 Instagram @mohalla.mart</a></div>`)}
const $=s=>document.querySelector(s),inr=n=>"₹"+Number(n).toLocaleString("en-IN");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon=p=>{const n=p.name.toLowerCase();for(const k in ICON)if(n.includes(k))return ICON[k];return CATI[p.cat]||"🛍️"};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1500)}
let S=null;try{S=JSON.parse(localStorage.getItem("mm_sess")||"null")}catch(e){}
const saveS=()=>{try{S?localStorage.setItem("mm_sess",JSON.stringify(S)):localStorage.removeItem("mm_sess")}catch(e){}};
async function auth(path,body){const r=await fetch(SB_URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.message||"Something went wrong. Please try again.");return j}
function setSession(j){const role=S&&S.role;S={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000-60000,user:{id:j.user.id,email:j.user.email,name:(j.user.user_metadata||{}).full_name||""},role:role||"buyer"};saveS()}
async function loadRole(){if(!S)return;const h={apikey:KEY,Authorization:"Bearer "+S.access_token};
try{const r=await fetch(SB_URL+"/rest/v1/profiles?select=full_name,role&id=eq."+S.user.id,{headers:h});const d=await r.json();if(Array.isArray(d)&&d[0]){S.role=d[0].role;if(d[0].full_name)S.user.name=d[0].full_name}}catch(e){}
try{const r=await fetch(SB_URL+"/rest/v1/seller_applications?select=shop_name,status&user_id=eq."+S.user.id,{headers:h});const d=await r.json();S.app=(Array.isArray(d)&&d[0])?d[0]:null}catch(e){S.app=null}
saveS()}
async function refreshS(){if(!S||Date.now()<S.expires_at)return;try{setSession(await auth("token?grant_type=refresh_token",{refresh_token:S.refresh_token}))}catch(e){S=null;saveS()}}
function acctBtn(){$("#ab").textContent=S?((S.user.name||S.user.email||"?").trim()[0]||"?").toUpperCase():"👤"}
const ROLE={buyer:"Buyer",seller:"Seller",admin:"Admin"};
function authView(mode,msg,kind){kind=kind||"buyer";const sell=mode=="signup"&&kind=="seller";
sheet(`<div class="sh"><h2>${mode=="login"?"Log in":sell?"Sell on Mohalla Mart":"Create account"}</h2><button class="x" data-close aria-label="Close">✕</button></div>
<div class="sb"><div class="seg"><button class="pill" aria-pressed="${mode=="login"}" data-am="login">Log in</button><button class="pill" aria-pressed="${mode=="signup"&&!sell}" data-am="signup">Sign up</button><button class="pill" aria-pressed="${sell}" data-ak="seller">Sell with us</button></div>
<form id="af" data-mode="${mode}" data-kind="${kind}" novalidate>${mode=="signup"?`<label class="fld"><span>Your name</span><input id="an" autocomplete="name" maxlength="60"></label>`:""}
<label class="fld"><span>Email (this is your login ID)</span><input id="ae" type="email" autocomplete="email" inputmode="email"></label>
<label class="fld"><span>Password (8 or more characters)</span><input id="ap" type="password" autocomplete="${mode=="login"?"current-password":"new-password"}"></label>
${sell?`<label class="fld"><span>Shop or brand name</span><input id="ash" maxlength="80"></label><label class="fld"><span>Mobile number (10 digits)</span><input id="aph" inputmode="numeric" maxlength="10" autocomplete="tel"></label><label class="fld"><span>City</span><input id="acy" maxlength="60"></label><p class="by">After you sign up, we review your shop and activate your seller account.</p>`:""}
<div class="err" id="aerr" role="alert">${esc(msg||"")}</div><button class="cta" type="submit">${mode=="login"?"Log in":sell?"Create seller account":"Create account"}</button></form>
${mode=="login"?`<p class="by" style="margin-top:14px">Want to sell? <button type="button" class="lnkb" data-ak="seller">Create a seller account</button></p>`:""}</div>`)}

function payBlock(o){const g={};let ce=0,cg=0;o.forEach(x=>{ce+=x.commission;cg+=x.commission_gst;if(x.payout_status=="unpaid"&&x.seller_id){const k=g[x.seller_id]||(g[x.seller_id]={n:x.seller_name||"Seller",t:0,c:0});k.t+=x.payout;k.c++}});const ks=Object.keys(g);
return `<h3 class="ah">Payouts</h3><p class="by">Your commission on delivered orders: <b>${inr(ce)}</b> + GST ${inr(cg)}</p>`+(ks.length?ks.map(k=>`<div class="mp"><div style="flex:1;min-width:0"><b>${esc(g[k].n)}</b><br><small>${g[k].c} delivered item(s) · owed <b>${inr(g[k].t)}</b></small></div><div><button class="ap" data-pay="${k}" data-amt="${g[k].t}">Mark paid</button></div></div>`).join(""):`<p class="msg">No payouts due.</p>`)}
async function payOut(sid,amt,b){if(!confirm("Mark "+inr(amt)+" as paid to this seller? Do this only after you have sent the money."))return;b.disabled=true;await refreshS();try{const r=await fetch(SB_URL+"/rest/v1/rpc/mark_seller_paid",{method:"POST",headers:{...sh(),"Content-Type":"application/json"},body:JSON.stringify({sid})});if(!r.ok)throw 0;toast("Marked as paid");adminView()}catch(e){b.disabled=false;toast("Could not update")}}

function shipView(id){sheet(`<div class="sh"><h2>Mark as shipped</h2><button class="x" data-close aria-label="Close">✕</button></div><div class="sb"><form id="shf" data-id="${esc(id)}" novalidate>
<label class="fld"><span>Courier name (e.g. Delhivery, India Post)</span><input id="shc" maxlength="40"></label>
<label class="fld"><span>Tracking number (optional)</span><input id="sht" maxlength="40" autocapitalize="characters"></label>
<div class="err" id="aerr" role="alert"></div><button class="cta" type="submit">Mark shipped</button></form></div>`)}
async function doShip(id){await refreshS();const c=$("#shc").value.trim(),t=$("#sht").value.trim();if(!c)return er("Please enter the courier name");
const b=$("#shf .cta");b.disabled=true;b.textContent="Please wait…";
try{const r=await fetch(SB_URL+"/rest/v1/order_items?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{...sh(),"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({status:"shipped",courier:c,tracking_no:t||null})});const d=await r.json().catch(()=>null);if(!r.ok||!Array.isArray(d)||!d.length)throw 0;toast("Marked as shipped");ordView(true,ordAll)}
catch(e){b.disabled=false;b.textContent="Mark shipped";er("Could not update. Please try again.")}}

let fl="",so="",bi=0;const off=p=>p.mrp>p.price?Math.round(100-p.price/p.mrp*100):0;
function banner(){const m=P.reduce((a,p)=>Math.max(a,off(p)),0),n=[
["#116b5b,#0b4d41","MEGA SALE",m?`Up to ${m}% OFF`:"Big savings","Fashion and local finds","Shop deals →",'data-fl="d30"'],
["#d6336c,#a61e4d","BUDGET STORE","Under ₹499","Styles that fit your pocket","Shop now →",'data-fl="u499"'],
["#f5aa1c,#e07a00","FREE DELIVERY","On orders over ₹999","Delivered to your door","Shop now →",'data-fl="fd"'],
["#0f1f1a,#2b4a40","SELL WITH US","Open your shop online","Join our first sellers","Start selling →",'data-ak="seller"']];
$("#bn").innerHTML=`<div class="bn" id="bnr">${n.map(x=>`<button class="bs" style="background:linear-gradient(135deg,${x[0]})" ${x[5]}><small>${x[1]}</small><h2>${x[2]}</h2><span>${x[3]}</span><b>${x[4]}</b></button>`).join("")}</div><div class="dots" id="dots">${n.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`;
const r=$("#bnr");r.onscroll=()=>{bi=Math.round(r.scrollLeft/(r.children[0].offsetWidth+10));[...$("#dots").children].forEach((d,k)=>d.classList.toggle("on",k==bi))}}
setInterval(()=>{const r=$("#bnr");if(!r||document.hidden)return;bi=(bi+1)%r.children.length;r.scrollTo({left:bi*(r.children[0].offsetWidth+10),behavior:"smooth"})},4500);
function flt(){$("#flt").innerHTML=[["d30","30%+ off"],["u499","Under ₹499"],["u999","Under ₹999"],["fd","Free delivery"]].map(x=>`<button class="pill" aria-pressed="${fl==x[0]}" data-fl="${x[0]}">${x[1]}</button>`).join("")+`<select id="so" aria-label="Sort"><option value="">Sort</option><option value="pl">Price: low to high</option><option value="ph">Price: high to low</option><option value="df">Biggest discount</option></select>`;$("#so").value=so}
function deals(){const l=P.filter(p=>off(p)>=20).sort((a,b)=>off(b)-off(a)).slice(0,8);
$("#dl").innerHTML=l.length?`<div class="dh"><h2>⚡ Top Deals</h2><span>Biggest discounts</span></div><div class="dl">${l.map(p=>`<div class="dc"><div class="art" style="background:${BG[p.cat]||"#eee"}">${thumb(p)}<span class="off">${off(p)}% off</span></div><div class="dp"><div class="nm">${esc(p.name)}</div><div class="pr">${inr(p.price)}<s>${inr(p.mrp)}</s></div></div><button class="add" data-add="${p.id}">Add to cart</button></div>`).join("")}</div>`:""}
document.addEventListener("change",e=>{if(e.target.id=="so"){so=e.target.value;grid()}});
banner();
async function logout(){const t=S&&S.access_token;S=null;saveS();acctBtn();close();toast("Logged out");if(t){try{await fetch(SB_URL+"/auth/v1/logout",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+t}})}catch(e){}}}
const TILES=[["Fashion","#f7d9c4"],["Accessories","#e4e0f4"],["Home","#d8e9e4"],["Gifting","#f6d0da"]];
const LBL={All:"All",Fashion:"Fashion",Accessories:"Accessories",Home:"Home & Living",Gifting:"Gifts",Beauty:"Beauty"};
function chips(){const ks=["All",...TILES.map(t=>t[0]).filter(k=>P.some(p=>p.cat==k))];$("#cats").innerHTML=ks.map(c=>`<button class="pill" aria-pressed="${c==cat}" data-c="${c}">${LBL[c]}</button>`).join("")}
function tiles(){const t=TILES.filter(t=>P.some(p=>p.cat==t[0]));
$("#tiles").innerHTML=t.length?`<div class="sec"><h2>Shop by Category</h2></div><div class="tg">${t.map(([k,bg])=>{const n=P.filter(p=>p.cat==k).length,im=(typeof CAT_IMG==="object"&&CAT_IMG&&typeof CAT_IMG[k]==="string"&&CAT_IMG[k].startsWith("https://"))?CAT_IMG[k]:"";return `<button class="tile" data-t="${k}"><div class="tp" style="background:${bg}">${CATI[k]}${im?`<img src="${esc(im)}" alt="" loading="lazy" onerror="this.remove()">`:""}</div><span class="l">${LBL[k]}</span><small>${n} item${n>1?"s":""}</small></button>`}).join("")}</div>`:""}
function grid(){
let l=P.filter(p=>(cat=="All"||p.cat==cat)&&(p.name+p.cat+p.by).toLowerCase().includes(q.toLowerCase()));
if(fl)l=l.filter(p=>fl=="d30"?off(p)>=30:fl=="u499"?p.price<=499:fl=="u999"?p.price<=999:p.price>=999);
if(so=="pl")l.sort((a,b)=>a.price-b.price);else if(so=="ph")l.sort((a,b)=>b.price-a.price);else if(so=="df")l.sort((a,b)=>off(b)-off(a));
$("#ttl").textContent=q?`Results for “${q}”`:(cat=="All"?"Trending now":(LBL[cat]||cat));
$("#cnt").textContent=l.length+" items";
$("#g").innerHTML=l.length?l.map(p=>`<article class="card"><div class="art" style="background:${BG[p.cat]||"#eee"}">${thumb(p)}${p.mrp>p.price?`<span class="off">${Math.round(100-p.price/p.mrp*100)}% off</span>`:""}</div>
<div class="info"><div class="nm">${esc(p.name)}</div><div class="by">by ${esc(p.by)}</div>
<div class="pr">${inr(p.price)}${p.mrp>p.price?`<s>${inr(p.mrp)}</s>`:""}</div>${p.mrp>p.price?`<div class="sv">You save ${inr(p.mrp-p.price)}</div>`:""}${p.price>=999?`<div class="fdl">Free delivery</div>`:""}
<button class="add" data-add="${p.id}">Add to cart</button></div></article>`).join(""):`<div class="msg">No products found. Try a different word or category.</div>`}
function count(){$("#cn").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function sheet(h){$("#sheet").innerHTML=h;$("#sheet").classList.add("on");$("#scrim").classList.add("on")}
function close(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on")}
function cartView(){
const l=Object.entries(cart).map(([id,n])=>({...P.find(p=>p.id==id),n})),t=l.reduce((a,x)=>a+x.price*x.n,0);
sheet(`<div class="sh"><h2>Your cart</h2><button class="x" data-close aria-label="Close">✕</button></div>
<div class="sb">${l.length?l.map(x=>`<div class="ln"><div><b>${esc(x.name)}</b><br><small>${inr(x.price)}</small></div>
<div class="q"><button data-dec="${x.id}" aria-label="Fewer">−</button><span>${x.n}</span><button data-inc="${x.id}" aria-label="More">+</button></div></div>`).join(""):`<p class="msg">Your cart is empty.</p>`}</div>
<div class="sf"><div class="tot"><span>Total</span><span>${inr(t)}</span></div>${l.length?`<button class="cta" data-co>Place order (Cash on Delivery)</button>`:""}</div>`)}
function nav(i){["n1","n2","n3","n4"].forEach((id,k)=>$("#"+id).classList.toggle("on",k==i))}
document.addEventListener("click",e=>{const b=e.target.closest("button,.scrim");if(!b)return;const d=b.dataset;
if(d.c){cat=d.c;chips();grid()}
else if(d.t){cat=d.t;chips();grid();$("#ttl").scrollIntoView({behavior:"smooth",block:"start"})}
else if(d.am){authView(d.am)}
else if(d.ak){authView("signup","",d.ak)}
else if(d.apply!==undefined){applyView()}
else if(d.addp!==undefined){addView()}
else if(d.lg){legalView(d.lg)}
else if(d.fl!==undefined){fl=(fl==d.fl&&!b.classList.contains("bs"))?"":d.fl;flt();grid();if(b.classList.contains("bs"))$("#g").scrollIntoView({behavior:"smooth",block:"start"})}
else if(d.co!==undefined){S?checkoutView():authView("login","Please log in to place your order")}
else if(d.mo!==undefined){ordView(false)}
else if(d.so!==undefined){ordView(true)}
else if(d.ao!==undefined){ordView(true,true)}
else if(d.os){const a=d.os.split(":");a[1]=="shipped"?shipView(a[0]):osUpd(a[0],a[1])}
else if(d.adm!==undefined){adminView()}
else if(d.act){adminAct(d.act,d.id,b)}
else if(d.pay){payOut(d.pay,d.amt,b)}
else if(d.myp!==undefined){myView()}
else if(d.acct!==undefined){acctView()}
else if(d.delp){delProduct(d.delp)}
else if(b.id=="ab"){S?acctView():authView("login")}
else if(d.logout!==undefined){logout()}
else if(d.add){cart[d.add]=(cart[d.add]||0)+1;count();toast("Added to cart")}
else if(d.inc){cart[d.inc]++;count();cartView()}
else if(d.dec){if(--cart[d.dec]<1)delete cart[d.dec];count();cartView()}
else if(d.close!==undefined||b.id=="scrim"){close();nav(0)}
else if(b.id=="cb"||b.id=="n3"){nav(2);cartView()}
else if(b.id=="n1"){nav(0);window.scrollTo({top:0})}
else if(b.id=="n2"){nav(1);$("#tiles").scrollIntoView({behavior:"smooth",block:"start"})}
else if(b.id=="n4"){nav(3);contactView()}
else if(d.w){const k=String(d.w);wish.has(k)?wish.delete(k):wish.add(k);saveW();toast(wish.has(k)?"Saved":"Removed");grid()}
else if(b.id=="shop"){cat="All";chips();grid();$("#ttl").scrollIntoView({behavior:"smooth",block:"start"})}});
$("#q").addEventListener("input",e=>{q=e.target.value;grid()});
document.addEventListener("submit",e=>{if(e.target.id=="af"){e.preventDefault();doAuth(e.target.dataset.mode,e.target.dataset.kind)}else if(e.target.id=="pf"){e.preventDefault();doApply()}else if(e.target.id=="prf"){e.preventDefault();doAddProduct()}else if(e.target.id=="cof"){e.preventDefault();doOrder()}else if(e.target.id=="shf"){e.preventDefault();doShip(e.target.dataset.id)}});
chips();
const wl=waLink();if(wl){const a=$("#wa");a.href=wl;a.style.display="grid"}
acctBtn();refreshS().then(loadRole).then(acctBtn);
const BI=(typeof BANNER_IMG==="string"&&BANNER_IMG.startsWith("https://"))?BANNER_IMG:"";
if(BI){const b=$(".hero");b.classList.add("photo");b.style.setProperty("--bi",'url("'+BI.replace(/"/g,"")+'")')}
const H={headers:{apikey:KEY,Authorization:"Bearer "+KEY}},U=SB_URL+"/rest/v1/products?select=",T="&status=eq.live&order=id";
fetch(U+"id,name,price,mrp,seller_name,image_url,categories(name)"+T,H).then(r=>r.json())
.then(d=>Array.isArray(d)?d:fetch(U+"id,name,price,mrp,seller_name,categories(name)"+T,H).then(r=>r.json()))
.then(d=>{
if(!Array.isArray(d))throw 0;
P=d.map(x=>({id:x.id,name:x.name,price:x.price,mrp:x.mrp,by:x.seller_name||"Seller",cat:x.categories?x.categories.name:"",img:(x.image_url&&String(x.image_url).startsWith("https://"))?x.image_url:""}));chips();tiles();flt();deals();banner();grid()})
.catch(()=>{$("#g").innerHTML='<div class="msg">Could not load products. Please try again.</div>'});
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}
</script></body></html>
